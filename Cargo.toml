[package]
name = "rat-invaders"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = "4.6.6"
colored = "3.1.1"
io = "0.0.2"
log = "0.4.34"
mpsc = "0.3.0"
rand = "0.10.2"
ratatui = "0.30.2"
russh = "0.63.3"
russh-keys = "0.49.2"
tokio = "1.53.1"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
